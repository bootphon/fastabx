[project]
name = "fastabx"
description = "A library for efficient computation of ABX discriminability"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Maxime Poli" },
  { name = "CoML", email = "dev@cognitive-ml.fr" },
]
keywords = ["machine learning", "speech"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26.4",
  "polars>=1.35.1",
  "torch>=2.10.0",
  "torchdtw>=0.4.0",
  "tqdm>=4.67.1",
]
dynamic = ["version"]

[project.urls]
changelog = "https://github.com/bootphon/fastabx/releases"
documentation = "https://docs.cognitive-ml.fr/fastabx"
homepage = "https://docs.cognitive-ml.fr/fastabx"
repository = "https://github.com/bootphon/fastabx"

[project.scripts]
fastabx = "fastabx.__main__:main"

[dependency-groups]
dev = [
  "prek>=0.4.5",
]
doc = [
  "furo>=2024.8.6",
  "matplotlib>=3.10.3",
  "packaging>=25.0",
  "sphinx>=8.1.3",
  "sphinx-argparse>=0.5.2",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.6.1",
  "sphinx-gallery>=0.21.0",
]
test = [
  "hypothesis>=6.135.31",
  "pandas>=3.0.3",
  "pytest>=9.0.2",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatch-vcs>=0.5.0", "hatchling>=1.28.0"]
build-backend = "hatchling.build"

[tool.coverage.run]
branch = true
source = ["src/fastabx"]

[tool.coverage.report]
fail_under = 99

[tool.hatch.version]
source = "vcs"

[tool.pytest]
addopts = ["--cov=fastabx"]
testpaths = ["tests"]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
preview = true
select = [
  "correctness",
  "suspicious",
  "complexity",
  "performance",
  "style",
  "security",
  "pedantic",
  "formatting",
]
ignore = [
  "docstring-missing-exception",
  "docstring-missing-returns",
  "docstring-missing-yields",
  "incorrect-blank-line-before-class",
  "missing-copyright-notice",
  "missing-trailing-comma",
  "multi-line-summary-second-line",
  "subprocess-without-shell-equals-true",
  "suspicious-subprocess-import",
  "too-many-arguments",
  "too-many-positional-arguments",
  "undocumented-magic-method",
  "undocumented-public-init",
]

[tool.ruff.lint.per-file-ignores]
"docs/conf.py" = [
  "builtin-variable-shadowing",
  "implicit-namespace-package",
]
"tests/*" = [
  "undocumented-public-function",
  "import-outside-top-level",
]
"examples/*" = [
  "D",
  "line-too-long",
  "implicit-namespace-package",
]
"scripts/check_features_and_item.py" = [
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
]
"scripts/compare_versions.py" = [
  "too-many-locals",
]

[tool.ruff.lint.pylint]
allow-magic-value-types = ["str", "int"]

[tool.ty.src]
exclude = [
  "scripts",
  "docs",
  "examples",
]

[tool.typos.default.extend-words]
IY = "IY"
