version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: yearly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 30
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: yearly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 30
    groups:
      uv:
        patterns:
          - "*"
  - package-ecosystem: pre-commit
    directory: "/"
    schedule:
      interval: yearly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 30
    groups:
      pre-commit:
        patterns:
          - "*"
